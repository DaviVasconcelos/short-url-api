name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore
        run: dotnet restore ShortUrl.slnx

      - name: Verify formatting
        run: dotnet format ShortUrl.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build ShortUrl.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test ShortUrl.slnx --no-build --configuration Release

  postgres:
    runs-on: ubuntu-latest
    needs: build-test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shorturl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore
        run: dotnet restore ShortUrl.slnx

      - name: Restore tools
        run: dotnet tool restore

      - name: Apply PostgreSQL migrations
        env:
          Database__Provider: Postgres
          ConnectionStrings__Postgres: "Host=localhost;Port=5432;Database=shorturl_test;Username=postgres;Password=postgres"
        run: >
          dotnet ef database update
          --project src/ShortUrl.Infrastructure.Postgres
          --startup-project src/ShortUrl.Api
          --context PostgresAppDbContext

      - name: Build
        run: dotnet build ShortUrl.slnx --no-restore --configuration Release

      - name: Test against PostgreSQL
        env:
          SHORTURL_TEST_POSTGRES: "Host=localhost;Port=5432;Database=shorturl_test;Username=postgres;Password=postgres"
        run: dotnet test ShortUrl.slnx --no-build --configuration Release

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t shorturl .